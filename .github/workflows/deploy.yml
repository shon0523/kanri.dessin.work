name: Deploy to GitHub Pages

# このブランチに push されるたびに、自動でビルドして GitHub Pages に公開します。
on:
  push:
    branches:
      - claude/c-studio-reserve-ui-1g9ofw
  workflow_dispatch: # GitHub の画面から手動実行も可能

# GitHub Pages へ公開するために必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ実行する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: プロトタイプをビルド
        run: npm run build

      - name: Pages 用の設定
        uses: actions/configure-pages@v5

      - name: ビルド成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
